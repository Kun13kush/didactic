name: Check OIDC identity

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to test
        required: true
        default: dev
        type: choice
        options:
          - dev
          - production

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          aws-region: eu-west-2
          allowed-account-ids: "732108543574"
          role-duration-seconds: 900
          role-session-name: github-oidc-check
          role-to-assume: ${{ inputs.environment == 'production' && 'arn:aws:iam::732108543574:role/finzla-prod-github-deploy' || 'arn:aws:iam::732108543574:role/finzla-dev-github-deploy' }}

      - name: Verify AWS caller
        run: aws sts get-caller-identity
